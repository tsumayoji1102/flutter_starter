## 参考: https://pub.dev/packages/flutter_flavorizr


app:
  android:
    flavorDimensions: "flavor-type"
    buildTypes:
      release:
        applicationIdSuffix: ""
      debug:
        applicationIdSuffix: ".dev"
flavors:
  dev:
    app: 
      name: "Flutter Starter(Dev)"
    ios:
      bundleId: "com.example.flutterStarter.dev"
    android:
      applicationId: "com.example.flutterStarter.dev"
  prod:
    app:
      name: "Flutter Starter"
    ios:
      bundleId: "com.example.flutterStarter"
    android:
      applicationId: "com.example.flutterStarter"